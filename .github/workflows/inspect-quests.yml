name: Inspect Astana Hub quests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install browser
        run: |
          python -m pip install --requirement requirements.txt
          python -m playwright install --with-deps chromium

      - name: Inspect active quests
        env:
          ASTANAHUB_EMAIL: ${{ secrets.ASTANAHUB_EMAIL }}
          ASTANAHUB_PASSWORD: ${{ secrets.ASTANAHUB_PASSWORD }}
        run: python inspect_quests.py

      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: quest-inspection
          path: quest-inspection.json
          retention-days: 1
