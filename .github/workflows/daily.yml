name: Astana Hub daily reward

on:
  schedule:
    # UTC+5: 06:40 and the retry exactly 12 hours later at 18:40.
    - cron: "40 1,13 * * *"
  workflow_dispatch:

concurrency:
  group: astanahub-daily-reward
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --requirement requirements.txt
          python -m playwright install --with-deps chromium

      - name: Sign in and claim reward
        id: visit
        continue-on-error: true
        env:
          ASTANAHUB_EMAIL: ${{ secrets.ASTANAHUB_EMAIL }}
          ASTANAHUB_PASSWORD: ${{ secrets.ASTANAHUB_PASSWORD }}
        run: python main.py

      - name: Save monthly log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs/*.log
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Astana Hub monthly log"
          git push

      - name: Report visit failure
        if: steps.visit.outcome == 'failure'
        run: exit 1
