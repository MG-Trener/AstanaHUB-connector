name: Astana Hub daily reward

on:
  schedule:
    # Lightweight eligibility check every five minutes, offset from the top of the hour.
    # Browser login starts only after 24 hours from the last successful reward claim.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

concurrency:
  group: astanahub-daily-reward
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check whether reward is due
        id: due
        shell: bash
        run: |
          if [ "$(python main.py --check-due)" = "due" ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "due=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.due.outputs.due == 'true'
        run: |
          python -m pip install --requirement requirements.txt
          python -m playwright install --with-deps chromium

      - name: Sign in and claim reward
        id: visit
        if: steps.due.outputs.due == 'true'
        continue-on-error: true
        env:
          ASTANAHUB_EMAIL: ${{ secrets.ASTANAHUB_EMAIL }}
          ASTANAHUB_PASSWORD: ${{ secrets.ASTANAHUB_PASSWORD }}
        run: python main.py

      - name: Save monthly log
        if: always() && steps.due.outputs.due == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs/*.log
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Astana Hub monthly log"
          git push

      - name: Report visit failure
        if: steps.visit.outcome == 'failure'
        run: exit 1
